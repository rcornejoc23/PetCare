spring.application.name=petcare

# H2 en ARCHIVO: los datos se guardan en la carpeta ./data y NO se pierden al detener la API.
# Para volver a modo memoria (se borra al detener) cambiar la url por: jdbc:h2:mem:petcaredb
spring.datasource.url=jdbc:h2:file:./data/petcare
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
